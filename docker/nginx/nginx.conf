worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Docker 内置 DNS：让上游地址在容器重建（IP 变化）后自动重新解析
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # NestJS Swagger 文档（保留 /api/docs 原路径）
    location /api/docs {
      set $nestjs_upstream "nestjs-api:3000";
      proxy_pass http://$nestjs_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 业务 API → NestJS（NestJS 启用了 URI 版本控制，接口在 /v1 下）
    location /api/ {
      set $nestjs_upstream "nestjs-api:3000";
      rewrite ^/api/(.*)$ /v1/$1 break;
      proxy_pass http://$nestjs_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 服务 → Python FastAPI（映射到 /api/v1）
    # SSE 流式响应需要关掉 nginx 缓存和 buffer,否则会等响应完整才下发
    location /ai/ {
      set $python_upstream "python-ai:5000";
      rewrite ^/ai/(.*)$ /api/v1/$1 break;
      proxy_pass http://$python_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # SSE 必备
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
      # 流式响应超时(默认 60s 太短,SSE 长连接需要更长)
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Go 高并发服务（映射到 /api/v1）
    location /go/ {
      set $go_upstream "go-service:8081";
      rewrite ^/go/(.*)$ /api/v1/$1 break;
      proxy_pass http://$go_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → 管理员新订单实时推送（Socket.IO，namespace /ws/admin-orders）
    # 关键：Upgrade / Connection 头 + 关闭 buffer + 长超时
    location /ws/ {
      set $nestjs_upstream "nestjs-api:3000";
      proxy_pass http://$nestjs_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket 长连接
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      proxy_cache off;
    }

    # 其余全部 → Next.js 用户端
    location / {
      set $nextjs_upstream "next-web:3001";
      proxy_pass http://$nextjs_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
