services:
  # Milvus（需要 Docker）
  milvus:
    image: milvusdb/milvus:v2.3.4
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_PATH=/var/lib/milvus/etcd
      - MINIO_USE_EMBED=true
      - MINIO_DATA_PATH=/var/lib/milvus/minio
    volumes:
      - milvus-data:/var/lib/milvus
    restart: unless-stopped

volumes:
  milvus-data:
